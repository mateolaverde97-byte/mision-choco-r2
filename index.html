os niños, la enseñanza transmite tres principios: Jesús nos ama, nos recibe y nos llama a tratar a los demás con amor. Con una representación sencilla, preguntas y ejemplos cotidianos, reforzaremos que ningún niño es insignificante. Frase central: «Jesús tiene un lugar para mí y yo puedo hacerle un lugar a los demás».", "tematica": "", "mm": "10:00–10:10 Bienvenida, presentación del equipo, organización de los niños en cinco grupos y explicación de la jornada. (Nataly Ruiz)\n10:10–10:25 Rompehielo: «El saludo diferente». Los niños deberán saludarse de distintas maneras para conocerse e integrarse. (Emanuel Rodríguez)\n10:25–10:40 Juego «Sigue al líder». Los niños imitan movimientos y acciones dirigidas por el equipo. (Allisson Domínguez)\n10:40–11:00 Representación bíblica de Marcos 10:13-16. Se dramatiza cómo Jesús recibe a los niños y los bendice. (Samuel Isaacs)\n11:00–11:10 Reflexión participativa. Preguntas sobre la historia, el amor de Jesús y cómo tratar a los demás. (Emanuel Rodríguez)\n11:00–11:30 Manualidad «Mi lugar con Jesús». Cada niño decora una tarjeta en forma de corazón con el mensaje de la enseñanza. (Anngie Moreno)\n11:30–11:45 Juego «¿Quién soy?». Representación mediante gestos de personajes bíblicos para que los niños adivinen. (Allisson Domínguez)\n11:45–11:55 Reflexión final, aplicación de la enseñanza y oración por los niños. (Samuel Isaacs)\n11:55–12:00 Entrega de manualidades, agradecimiento y despedida. (Nataly Ruiz)", "pe": "Samuel Isaacs: Coordina la actividad, prepara y dirige la enseñanza de Marcos 10:13-16, realiza la representación de Jesús, dirige las preguntas de reflexión y realiza la oración final.\nEmanuel Rodríguez: Dirige los juegos rompehielo y \"Sigue al líder\", explica las instrucciones, representa a uno de los personajes de la historia bíblica y dirige el juego de personajes.\nAnngie Moreno: Prepara y dirige la manualidad de los corazones, distribuye los materiales, explica cómo decorar las tarjetas y acompaña a los niños durante su elaboración.\nNataly Ruiz: Organiza previamente los materiales, prepara el espacio, apoya los juegos, distribuye los elementos necesarios y se encarga de recoger y verificar los materiales al finalizar.\nAllisson Domínguez: Recibe a los niños, ayuda a organizarlos en grupos, verifica que todos participen, acompaña la manualidad y apoya a los niños que necesiten ayuda.", "ma": "2 × Blocs de Cartulinas de Colores (Carta) · Bogotá · $6000\n12 × Marcadores (multicolor) · Quibdó · $800 · reutilizable\n6 × Cajas de Colores (x12) · Quibdó · $4000 · reutilizable\n8 × Pegante en barra (Medianos) · Quibdó · $3000 · reutilizable\n40 × Impresion de versiculo (Marcos 10:14) · Quibdó · $300\n1 × Cinta de enmascarar (rollo) · Quibdó · $5000 · reutilizable", "nec": "Montaje: organización sencilla de un salón o espacio autorizado por la fundación. Se requiere una mesa para distribuir los materiales, sillas para los niños y un espacio despejado para los juegos."}], "pre": {"que": "Jesús me conoce y me recibe: una actividad que combina juegos grupales, una representación de Jesús y los niños (Marcos 10:13-16) y una manualidad en la que cada niño hará una tarjeta con el mensaje “Jesús me recibe y me ama”. El propósito es que aprendan sobre el amor de Jesús mientras comparten y se divierten.", "enfoque": "Basada en Marcos 10:13-16, donde Jesús recibe a los niños, la enseñanza transmite tres principios: Jesús nos ama, nos recibe y nos llama a tratar a los demás con amor. Con una representación sencilla, preguntas y ejemplos cotidianos, reforzaremos que ningún niño es insignificante. Frase central: «Jesús tiene un lugar para mí y yo puedo hacerle un lugar a los demás».", "como": "", "mm": [{"a": "10:10", "b": "10:15", "q": "Bienvenida, presentación, armado de grupos y explicación", "p": "Nataly Ruiz"}, {"a": "10:15", "b": "10:25", "q": "Rompehielo \"El saludo diferente\"", "p": "Emanuel Rodríguez"}, {"a": "10:25", "b": "10:35", "q": "Juego \"Sigue al líder\"", "p": "Allisson D ion de versiculo", "t": "Marcos 10:14", "c": 40, "u": 300, "s": "Quibdó", "re": false}, {"i": "Cinta de enmascarar", "t": "rollo", "c": 1, "u": 5000, "s": "Quibdó", "re": true}], "lluvia": "", "nec": ""}, "jmax": null, "aviso": null}, {"id": "b4-a", "b": "b4", "rol": "ninos", "tit": "Programa A · \"Dios te conoce\" (menores de 10)", "eq": [3, 2, 5], "line": "1 Samuel 3 y el buen pastor, con friso y cajita de peticiones.", "ven": [["13:30", "15:30"]], "notas": ["Para menores de 10 años (corte en 10 años).", "Ajustado al tiempo y reusando materiales (viene precargado).", "Coreografía: a discreción de los líderes."], "origen": [{"id": "t3-actninos", "equipo": 3, "lider": "Anngie Moreno", "espacio": "Actividades con los niños", "idea": "Dios está cerca de ti: se quiere transmitir a los niños que Dios los conoce personalmente, sabe quiénes son, se interesa por ellos y conoce esas cosas que nadie más sabe. Además, al conocerlos tanto ha puesto un propósito especial en la vida de cada uno de ellos.", "enfoque": "Partimos de 1 Samuel 3:1-10, donde Samuel escucha la voz de Dios, y lo conectamos con Juan 10:3-4, donde Jesús, el Buen Pastor, llama a sus ovejas por su nombre. Queremos que los niños comprendan que Dios los conoce personalmente, que pueden acercarse a Él y aprender a reconocer su voz, y que su vida tiene un propósito desde ahora; no necesitan esperar a ser adultos para caminar con Él.", "tematica": "", "mm": "13:30–13:35 Bienvenida: recibimos a los niños por medio de un saludo especial. Los recibimos, les preguntamos su nombre y tenemos una lista con la forma en la que quieren ser saludados, deben escoger una de estas opciones: choca esos 5, abrazo, choca el puño, saludo con la mano, apretón de manos o se invita a que cree un nuevo saludo. De fondo suenan canciones, esto con hacer de la bienvenida algo diferente, pero si por el contrario, es algo más casual podemos simplemente recibirlos y ubicarlos en el espacio.\n13:35–13:50 Juegos rompehielos:  Juego 1: se inicia separando a los niños en una cantidad equitativa por grupos. Cada grupo se toma de las manos y el juego consiste en pasar un ula ula por su cuerpo sin separarse, se debe trabajar en equipo. (Opciones competencia entre grupos). Juego 2: conservando el mismo círculo, se jugará tingo tingo tango pasando una pelota, el líder hará preguntas al niño fáciles cómo: su nombre y comida favorita, animal favorito, que quiere ser cuando grande (preguntas de interés para conocerlos) y también pequeños retos que lo haga más divertido. Juego 3: conservando el círculo, se dará la indicación de que cada persona del círculo debe preparar un paso de baile fácil, en cada turno la persona debe decir su nombre, mostrar su paso, y la persona siguiente debe hacer el paso anterior y su nuevo paso.\n13:50–14:00 Juego grupal Charadas: para empezar a introducir el mensaje de ¿Quién soy? Y Dios conoce mi nombre, jugaremos con todos charadas, los maestros y luego niños que quieran pasar, deben tomar una palabra de una bolsa y sin decir ninguna palabra hacer gestos para que las demás personas adivinen su personaje. Los papeles pueden contener nombre de animales, objetos, películas y comidas. Terminamos diciendo que Dios conoce nuestro nombre así como nosotros conocimos los nombres en este juego\n14:00–14:20 Representación teatral de 1 Samuel 3: 1-10. De manera corta y sencilla se representa el llamado de Dios a Samuel y un maestro da una pequeño mensaje explicando lo que pasó, por qué y como es aplicable a sus vidas sabiendo que Dios conoce sus nombres y los ha llamado por una razón\n14:20–14:35 Representación teatral el buen pastor,como acto seguido de la representación anterior se inicia con una persona vestida de pastor, se les pregunta a los niños que hace esta persona, otra u otras personas con una pequeña personificación de ovejas andan por el lugar y el pastor las trae de vuelta, las ovejas hablan y dicen porque se fueron (situaciones que los niños puedan sentir), se llega a la reflexión de que el pastor las buscó y las trajó de nuevo a su rebaño. Se termina orando en dirección a estas enseñanzas\n14:35–14:50 Baile: Libre soy (se puede cambiar la canción). Una persona inicia enseñando los pasos sin música, avanza poco a poco con pequeños fragmentos de la canción enseñando a los niños el baile, hasta el final bailarla por completo. Se termina una pequeña reflexión del significado de la canción de libertad y como somos libres en relación con las enseñanzas anteriores (Allisson Domínguez)\n14:50–15:40 Manualidad: (se proponen varias ya que son cortas y todas componen el mismo elemento) La idea es que los niños se puedan llevar un friso a su casa, donde cada una de sus caras, se pueda personalizar Lado 1: El niño pone de manera creativa su nombre Lado 2: Aparece la figura de Jesús y al lado un avatar para personalizar, el niño debe decorarlo a su gusto Lado 3: Espacio en blanco para dibujar sus gustos (comida favorita, animal favorito, algún sueño que tengan) Lado 4: Espacio para escribir algo a Dios, preguntarle algo, pedir por algo, agradecer por algo  Al final pasamos una cajita cerrada con un orificio donde les explicamos que pueden poner de forma anónima una oración a Dios, ya sea escrito, por medio de in dibujo y que nosotros nos llevaremos esa cajita con sus peticiones para orar por ellos  Luego preguntamos si algunos quieren compartir su friso con los demás, hacemos preguntas y finalizamos con la pregunta: ¿Qué te llevas de la enseñanza?  Terminamos orando, agradeciendo por venir y despidiendonos.", "pe": "Nataly Ruiz: Diseña y lleva el material (palabras charadas y guías impresas). Supervisa la actividad de acuerdo a su rol\nAllisson Domínguez: Prepara y enseña el baile con pasos fáciles y repetitivos. Supervisa la actividad de acuerdo a su rol\nAnngie Moreno: Supervisa la actividad de acuerdo a su rol. Prepara actuación corta. Resumen del mensaje central\nSamuel Isaacs: Supervisa la actividad de acuerdo a su rol. Prepara actuación corta. Resumen del mensaje central\nEmanuel Rodríguez: Supervisa la actividad de acuerdo a su rol. Prepara actuación corta.", "ma": "3 × Hoja impresa con saludos (Carta a color) · Bogotá · $600\n4 × Hula hula (normales) · Quibdó · $5000 · reutilizable\n4 × Pelota (pequeña) · Quibdó · $2000 · reutilizable\n70 × Hojas impresas para el friso (carta a blanco y negro) · Bogotá · $300\n6 × Cajas de colores (x12 o 24 unidades cada caja) · Quibdó · $10000 · reutilizable\n2 × Pintucaritas negra y blanca (1 de cada color) · Bogotá · $2500", "nec": "Parlante"}], "pre": {"que": "Dios está cerca de ti: se quiere transmitir a los niños que Dios los conoce personalmente, sabe quiénes son, se interesa por ellos y conoce esas cosas que nadie más sabe. Además, al conocerlos tanto ha puesto un propósito especial en la vida de cada uno de ellos.", "enfoque": "Partimos de 1 Samuel 3:1-10, donde Samuel escucha la voz de Dios, y lo conectamos con Juan 10:3-4, donde Jesús, el Buen Pastor, llama a sus ovejas por su nombre. Queremos que los niños comprendan que Dios los conoce personalmente, que pueden acercarse a Él y aprender a reconocer su voz, y que su vida tiene un propósito desde ahora; no necesitan esperar a ser adultos para caminar con Él.", "como": "", "mm": [{"a": "13:30", "b": "13:40", "q": "Bienvenida con saludo especial (lista de saludos), nombres y armado de los grupos", "p": ""}, {"a": "13:40", "b": "13:55", "q": "Rompehielos: hula hula en equipo y tingo tingo tango con preguntas", "p": ""}, {"a": "13:55", "b": "14:05", "q": "Charadas \"¿Quién soy?\" → Dios conoce mi nombre", "p": ""}, {"a": "14:05", "b": "14:25", "q": "Representación de 1 Samuel 3:1-10 y mensaje", "p": ""}, {"a": "14:25", "b": "14:40", "q": "El buen pastor y oración", "p": ""}, {"a": "14:40", "b": "15:15", "q": "Manualidad: friso de 2 lados (nombre; Jesús con avatar) + cajita de peticiones anónimas + compartir", "p": ""}, {"a": "15:15", "b": "15:30", "q": "Reflexión final (\"¿Qué te llevas?\"), oración y despedida", "p no", "espacio": "Las Palmas", "idea": "Recordarles a los niños y adultos que en vez de preocuparse, pueden decirle a Dios todo lo que necesitan y agradecerle por todo lo bueno, eso les ayudará a tener la paz de Cristo aún en medio de las situaciones difíciles.", "enfoque": "Filipenses 4:6-7 “No se preocupen por nada; en cambio, oren por todo. Díganle a Dios lo que necesitan y denle gracias por todo lo que él ha hecho. Así experimentarán la paz de Dios, que supera todo lo que podemos entender. La paz de Dios cuidará su corazón y su mente mientras vivan en Cristo Jesús.” La enseñanza, actividad manual y oración se relacionan con esto para que los niños comprendan esto.", "tematica": "", "mm": "09:00–09:15 15 minutos. llegada, montaje y preparación de materiales, bienvenida a niños e interacción con ellos.\n09:15–09:45 20 minutos. Obra de teatro y danza (ellos coordinan) puede que sea en otra hora pero tendrá esa duración.\n09:45–10:15 30 minutos. Juegos de recreación: 1) Simón dice 2) Barcos: Armar grupos de x cantidad de niños 3) Armar equipos y pedirles crear un nombre y barra creativa, y cada equipo mostrar su barra. 4) Decirles tienen que armar la letra ej “A”  por equipos, y el primer equipo gana. (Samuel Carrillo)\n10:15–10:35 20 minutos. Enseñanza. Compartirles una reflexión donde se refleje cómo el terremoto les pudo haber afectado en las distintas áreas de su vida y cuya idea central sea Filipenses 4:6-7 (no se preocupen por nada, en cambio pidan a Dios todo lo que necesitan, con acción de gracias) (Alejandra Hernández)\n10:35–11:15 40 minutos. Actividad manual.Cada niño o adulto le escribirá una carta a Dios. La carta tendrá una parte de gratitud (¿por qué estoy agradecido?) y una parte de peticiones (¿Qué quiero pedirle a Dios?) pueden escribir y dibujar. (Isabella Beltrán)\n11:15–11:25 10 minutos. Oración. De la mano con la actividad anterior, una persona ora dando gracias a Dios y también pidiéndole por las peticiones de los niños y adultos. (Daniel Moreno)\n11:25–11:45 20 minutos. Coreografías para niños. Canciones que tienen que ver con gozo y agradecimiento aún en la dificultad. Opciones: a) Cristo es mi superheroe - Xtreme kids b) Tanto - Xtreme kids c) Goliat - Su presencia Kids d) Fiesta en el desierto - montesanto (Alejandra Hernández)\n11:45–12:00 15 minutos. Cierre, agradecer a los niños por venir, despedirnos y todos recoger materiales. (Natalia Casallas)", "pe": "Alejandra Hernández: Da la enseñanza y dirige las coreografías\nSamuel Carrillo: Dirige la recreación\nIsabella Beltrán: Da la instrucción de la actividad manual\nDaniel Moreno: Dirige la oración\nNatalia Casallas: Agradece y da la despedida a los niños", "ma": "70 × impresiones a blanco y negro para el trabajo manual (impresión tamaño carta) · Bogotá · $300\n70 × lápices (lapiz negro) · Bogotá · $1 · reutilizable\n10 × colores (cajas) · Bogotá · $7 · reutilizable\n10 × tajalápices (tajalápiz con depósito para no hacer reguero) · Bogotá · $2 · reutilizable", "nec": "-Micrófono para hablar \n-parlante para colocar las canciones de las coreografías"}], "pre": {"que": "Recordarles a los niños y adultos que en vez de preocuparse, pueden decirle a Dios todo lo que necesitan y agradecerle por todo lo bueno, eso les ayudará a tener la paz de Cristo aún en medio de las situaciones difíciles.", "enfoque": "Filipenses 4:6-7 “No se preocupen por nada; en cambio, oren por todo. Díganle a Dios lo que necesitan y denle gracias por todo lo que él ha hecho. Así experimentarán la paz de Dios, que supera todo lo que podemos entender. La paz de Dios cuidará su corazón y su mente mientras vivan en Cristo Jesús.” La enseñanza, actividad manual y oración se relacionan con esto para que los niños comprendan esto.", "como": "", "mm": [{"a": "09:00", "b": "09:15", "q": "15 minutos. llegada, montaje y preparación de materiales, bienvenida a niños e interacción con ellos.", "p": ""}, {"a": "09:15", "b": "09:45", "q": "20 minutos. Obra de teatro y danza (ellos coordinan) pu rón", "r": "montaje"}, {"p": "David Castaño", "r": "Dirije la actividad"}], "jg": [], "ma": [{"i": "vasos grandes", "t": "paquete de 10", "c": 1, "u": 15000, "s": "Bogotá", "re": true}, {"i": "Balones", "t": "variados", "c": 3, "u": 25000, "s": "Quibdó", "re": false}], "lluvia": "", "nec": ""}, "jmax": null, "aviso": null}, {"id": "b8-adu", "b": "b8", "rol": "conexion", "tit": "Cuerda de tres hilos (adultos)", "eq": [4, 1], "line": "Dios en el centro del hogar (Eclesiastés 4:9-12).", "ven": [["16:00", "16:45"]], "notas": ["Eliminar todo lo relacionado con niños: ellos tienen su propia actividad con los equipos 3 y 5.", "Pueden usar la misma actividad, o que el equipo 1 la enriquezca con una segunda actividad dentro del mismo espacio, enseñando otro principio práctico relacionado con la salud mental después del terremoto.", "Un solo grupo de adultos."], "origen": [{"id": "t4-taller", "equipo": 4, "lider": "Daniel Moreno", "espacio": "Taller para familias", "idea": "Queremos que las familias entiendan que cuando Dios está en el centro del hogar, la familia se mantiene unida, como una cuerda de tres hilos que no se rompe fácil. Los adultos y los niños trabajan por separado y al final se juntan para orar en familia.", "enfoque": "1. Recibimos a la gente con un saludo a cada familia. Les decimos que van a hacer algo juntos que se pueden llevar a la casa. Los niños se van a su espacio cantando y los adultos se sientan en círculo.\n2. En grupitos de adultos hablamos de lo que está afectando a la familia y de qué podemos hacer para estar más unidos. Todo hablado.\n3. Los del equipo, oramos por las familias al final", "tematica": "Lo define Mateo", "mm": "16:00–16:10 Organizamos los dos espacios: sillas en círculo para adultos y esteras para niños. Dejamos los materiales listos. (Daniel Moreno)\n16:10–16:15 Recibimos a las familias con música, las saludamos y separamos a los niños de los adultos. (Alejandra Hernández)\n16:15–16:30 Adultos: mostramos un hilo delgado que se rompe fácil y luego una cuerda de tres hilos que no se rompe. Les preguntamos por qué pasa eso. (Daniel Moreno)\n16:16–16:30 Niños: cantamos una cancion y les hacemos un juego (se juntan en grupos según el número que se diga). (Isabella Beltrán)\n16:15–16:30 Adultos: leemos Eclesiastés 4:9-12 y hablamos de que Dios es el tercer hilo. También del perdón, de hablar en familia y de orar juntos en casa. (Daniel Moreno)\n16:15–16:30 Niños: contamos la historia de Noé y su familia, de cómo Dios los cuidó porque le obedecieron. Usamos la cuerda para explicarles. (Natalia Casallas)\n16:30–16:45 Adultos: hacen un cordón con tres hilos de lana (blanco es Dios, rojo y azul es la familia) mientras hablan en grupitos: ¿qué está dañando a mi familia? ¿qué puedo hacer esta semana para que estemos más unidos? (Alejandra Hernández)\n16:30–16:45 Niños: dibujan a su familia en una tarjeta que tiene el versículo y escriben o les ayudamos a poner un mensaje para la familia (Isabella Beltrán)\n16:45–16:55 Los niños vuelven con sus papás y les entregan la tarjeta. Los papás les amarran el cordón en la muñeca como señal de que van a estar unidos. (Daniel Moreno)\n16:45–16:55 Oramos por cada familia tomados de las manos y hacemos una oración final por todos. (Samuel Carrillo)\n16:55–17:00 Nos despedimos, damos dulces a los niños y los invitamos a las siguientes actividades. (Natalia Casallas)\n16:55–17:00 Recogemos sillas, materiales, y dejamos limpio. (Samuel Carrillo)", "pe": "Daniel Moreno: arma y recoge los espacios, y dirige el momento en que niños y papás se vuelven a juntar.\nSamuel Carrillo: está con los adultos. Hace la actividad de la cuerda, da la enseñanza y dirige la oración por las familias.\nNatalia Casallas: está con los niños. Cuenta la historia de Noé y hace la despedida al final.\nAlejandra Hernández: recibe a la gente, separa los grupos y acompaña a los adultos cuando hacen el cordón y conversan.\nIsabella Beltrán: está con los niños. Dirige la canción, el juego y el dibujo de las tarjetas.", "ma": "3 × Lana blanca, roja y azul (100 g) · Bogotá · $7\n3 × Cuerda gruesa para mostrar (1,5 mt) · Bogotá · $2\n1 × Fichas bibliograficas (El paquete viene X 100) · Bogotá · $8\n15 × Versículo impreso (15 hojas tamaño carta) · Bogotá · $500\n10 × CRAYONES (CAJAS x 12) · Bogotá · $20000 · reutilizable\n6 × TIJERAS PUNTA ROMA (PEQUEÑAS) · Bogotá · $6 · reutilizable\n2 × CINTA DE ENMASCARAR (ROLLOS GRANDES) · Bogotá · $5 · reutilizable\n3 × PEGANTE EN BARRA (MEDIANOS) · Bogotá · $4 · reutilizable\n1 × DULCES (1 PAQUETE X 100) · Bogotá · $11 · reutilizable", "nec": "Un parlante con micrófono.\nDos espacios separados, ojalá con sombra o carpa.\nUnas 50 sillas para los adultos\nUna mesa pequeña para cada grupo."}], "pre": {"que": "Queremos que las familias entiendan que cuando Dios está en el centro del hogar, la familia se mantiene unida, como una cuerda de tres hilos que no se rompe fácil. Los adultos y los niños trabajan por separado y al final se juntan para orar en familia.", "enfoque": "1. Recibimos a la gente con un saludo a cada familia. Les decimos que van a hacer algo juntos que se pueden llevar a la casa. Los niños se van a su espacio cantando y los adultos se sientan en círculo.\n2. En grupitos de adultos hablamos de lo que está afectando a la familia y de qué podemos hacer para estar más unidos. Todo hablado.\n3. Los del equipo, oramos por las familias al final\nLo define Mateo", "como": "", "mm": [{"a": "16:00", "b": "16:10", "q": "Organizamos los dos espacios: sillas en círculo para adultos y esteras para niños. Dejamos los materiales listos.", "p": "Daniel Moreno"}, {"a": "16:10", "b": "16:15", "q": "Recibimos a las familias con música, las saludamos y separamos a los niños de los adultos.", "p": "Alejandra Hernández"}, {"a": "16:15", "b": "16:30", "q": "Adultos: mostramos un hilo delgado que se rompe fácil y luego una cuerda de tres hilos que no se rompe. Les preguntamos por qué pasa eso.", "p": "Daniel Moreno"}, {"a": "16:16", "b": izar una jornada comunitaria con juegos tradicionales, dinámicas de integración y actividades participativas que permitan compartir el amor de Jesús con  jóvenes y adultos. A través de la recreación, conversaciones cercanas, una enseñanza bíblica y espacios de oración, queremos transmitir que Jesús nos conoce", "enfoque": "Atraemos: invitando a participar en juegos tradicionales, retos grupales, música y dinámicas para todas las edades. Conversamos: aprovechamos cada actividad para conocer a las personas, escuchar sus experiencias y compartir mensajes bíblicos relacionados con sus vidas.\nOramos: ofrecemos oración voluntaria por las necesidades personales y familiares, y compartimos el mensaje de salvación en Jesús", "tematica": "", "mm": "08:30–09:00 Organizar el espacio, ubicar los juegos, preparar materiales y distribuir responsabilidades entre voluntarios. (Lizeth Pérez)\n09:00–09:15 Bienvenida a los niños/adultos, presentación de los equipos música, rompehielos y juego de integración para generar confianza. (Camila Berruecos)\n09:15–09:35 Rompehielos: pelota preguntona\tPasar una pelota al ritmo de la música. Al detenerse, quien la tenga responde una pregunta divertida o de integración. (María Alejandra Aguilar)\n09:35–10:10 Circuito de juegos\tOrganizar estaciones con bolos de la fe, carrera de obstáculos y derriba los obstáculos. Los participantes rotan por grupos. (Lizeth Pérez)\n10:10–10:30 Ruleta de las emociones\tCada participante gira la ruleta, identifica cómo se siente y recibe un mensaje de esperanza relacionado con Jesús. (Gabriela Arteaga)\n10:30–10:50 Enseñanza bíblica \tCompartir el mensaje central: Jesús nos ama, nos conoce y nos invita a acercarnos a Él. (Camila Berruecos)\n10:50–11:15 Mural de los corazones\tCada persona escribe una petición, agradecimiento o palabra que represente lo que hay en su corazón. (María Alejandra Aguilar)\n11:15–11:45 Conversación y oración\tAcercamiento personal, escucha activa, presentación del mensaje de salvación e invitación voluntaria a recibir oración. (Gabriela Arteaga)\n11:45–12:00 Cierre y despedida\tAgradecer a la comunidad, entregar mensajes sorpresa con versículos, recoger materiales y organizar el espacio. (Gabriela Arteaga)", "pe": "María Alejandra Aguilar: Realiza preguntas en estacion pelota preguntona\nLizeth Pérez: Se encarga de Estacion bolos de la fe, carrera de obstáculos y derriba los obstáculos\nGabriela Arteaga: Hacer estacion ruleta emociones\nMaría Alejandra Aguilar: Dirige estacion Mural de Corazones\nCamila Berruecos: Enseñanza Biblica", "ma": "12 × Botellas plásticas recicladas (500 ml) · Quibdó · $0\n2 × Pelotas de plastico (medianas) · Bogotá · $3000\n2 × Cartón reciclado () · Quibdó · $0\n15 × Vasos reutilizables (300 ml) · Bogotá · $6000\n1 × Palabritas de vida [Promesas] https://www.clccolombia.com/ () · Bogotá · $11\n1 × Marcadores (paquete) · Bogotá · $0\n1 × Cuerda (rollo) · Bogotá · $10000\n1 × Cinta adhesiva (rollo) · Bogotá · $3000\n2 × Tijeras () · Bogotá · $4000\n1 × PARLANTE CON MUSICA CRISTIANA DESCARGADA () · Ya lo tenemos · reutilizable\n6 × TIZA (paquete) · Bogotá · $4000\n50 × HOJAS RECICLADAS (Carta) · Bogotá · $0 · reutilizable", "nec": ""}, {"id": "t4-terrazas", "equipo": 4, "lider": "Daniel Moreno", "espacio": "Grupo B · Las Terrazas", "idea": "Realizaremos una jornada comunitaria con juegos cooperativos para niños y adultos, dinámicas de integración y una enseñanza bíblica sobre la esperanza en Dios. Buscaremos acercarnos a las familias, escucharlas, compartir el mensaje de Jesús y acompañarlas en oración.", "enfoque": "Invitaremos a niños y adultos a participar en juegos, retos grupales y actividades creativas como el mural de la esperanza. \nMientras compartimos las actividades, nos acercaremos a las familias para conocerlas, preguntarles cómo están, escuchar sus experiencias y conocer sus necesidades.\nOfreceremos oración personal para quienes lo deseen, escuchando sus peticiones y orando por sus familias.", "tematica": "", "mm": "08:30–08:40 Llegada, presentación del equipo y oración inicial.\n08:40–09:00 Organización del espacio y montaje\n09:00–09:35 Juegos de integración, rompehielos y retos cooperativos.\n09:35–10:15 Actividad principal: La red de la esperanza y mural comunitario.\n10:15–10:30 Descanso y conversación con las familias.\n10:30–11:00 Enseñanza bíblica: Dios está cerca de nosotros.\n11:00–11:30 Oración por las familias, ministración, escucha y acompañamiento personal.\n11:30–12:00 Despedida, cierre y recogida de materiales.", "pe": "Daniel Moreno: Coordinación general, dirección de los juegos, enseñanza y supervisión de la jornada.\nAlejandra Hernández: Liderar las dinámicas de integración y acompañar las actividades con los niños.\nIsabella Beltrán: Apoyará las actividades en Aposento Alto.\nSamuel Carrillo: Apoyará las actividades en Aposento Alto.", "ma": "", "nec": "Facilitar el contacto con los voluntarios de Quibdó.\nConfirmar la disponibilidad de músico para ministración."}], "pre": {"que": "", "enfoque": "", "como": "", "mm": [], "pe": [], "jg": [], "ma": [], "lluvia": "", "nec": ""}, "jmax": 5, "aviso": null}, {"id": "b9-nin", "b": "b9", "rol": "ninos", "tit": "Búsqueda del tesoro", "eq": [1, 4], "line": "\"Jesús es el tesoro\" (Mateo 13:44): estaciones, rompecabezas y cofre.", "ven": [["8:45", "11:45"]], "notas": ["El equipo 1 realiza la búsqueda del tesoro con la base del modelo de Anngie (viene precargado). Para más dudas, consultar a Anngie.", "Una parte del equipo 4 apoya esta actividad (la define el líder del equipo 4).", "Definir quién hace el cierre de la enseñanza."], "origen": [{"id": "t3-terrazas", "equipo": 3, "lider": "Anngie Moreno", "espacio": "Grupo B · Las Terrazas", "idea": "Búsqueda del tesoro por estaciones: 4 grupos de colores superan retos y cada uno gana una pieza del mapa. Solo al juntar las 4 piezas leen la frase Jesús es el tesoro y siguen el camino hasta el cofre. Luego viene la enseñanza y colorean un cofre para llevar a casa.", const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(n || 0).toLocaleString('es-CO');
const clone = o => JSON.parse(JSON.stringify(o));
const nowTxt = ts => { if(!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}); };
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function tmin(s){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim()); if(!m) return null; return (+m[1])*60 + (+m[2]); }
function t12(s){ const v = tmin(s); if(v == null) return s; let h = Math.floor(v/60), m = v%60; const ap = h >= 12 ? 'pm' : 'am'; h = h%12 || 12; return h + ':' + String(m).padStart(2,'0') + ' ' + ap; }
const venTxt = f => f.ven.map(v => t12(v[0]) + ' – ' + t12(v[1])).join(' y ');

/* ---------- estado ---------- */
let ME = lsGet('r2_me', null);           // {team, name}
let STORE = lsGet('r2_store', {});       // id -> {data, version, estado, editor, actualizado, costo, envio}
let DIRTY = lsGet('r2_dirty', {});       // id -> true si hay cambios sin subir
let ONLINE = !!API, LASTSYNC = 0, ADMIN = lsGet('r2_admin', false);
let view = {}, saveTimers = {};
function persist(){ lsSet('r2_store', STORE); lsSet('r2_dirty', DIRTY); }
function rec(id){ return STORE[id] || null; }
function dataOf(id){ const r = rec(id); return r && r.data ? r.data : clone(FB[id].pre); }
function isPre(id){ return !rec(id); }

/* ---------- cálculos ---------- */
function priceErr(m){
  const u = Number(m.u);
  if(m.u === '' || m.u == null || isNaN(u)) return 'Escribe el precio por unidad.';
  if((m.s === 'Ya lo tenemos' || m.s === 'Prestado') && u === 0) return '';
  if(u < 100) return 'Escribe el precio en pesos completos: mínimo $100, en cientos o miles (ej. 300, 2.500, 12.000). No escribas 2 para decir 2.000.';
  if(u % 100 !== 0) return 'El precio debe ir en cientos o miles (ej. 300, 2.500, 12.000).';
  return '';
}
function qtyErr(m){ const c = Number(m.c); if(!Number.isInteger(c) || c < 1) return 'La cantidad debe ser un número entero de 1 o más (unidades).'; return ''; }
function lineTot(m){ const c = Number(m.c), u = Number(m.u); return (isFinite(c) && isFinite(u)) ? c*u : 0; }
function total(d){ return (d.ma || []).reduce((a, m) => a + lineTot(m), 0); }
function capOf(f){ const b = BY[f.b]; if(b.ppto == null) return null; return b.acts ? Math.floor(b.ppto / b.acts) : 0; }
function blockTotal(bid, overId, overData){ return DATA.fichas.filter(f => f.b === bid).reduce((a, f) => a + total(f.id === overId ? overData : dataOf(f.id)), 0); }
function mmOut(f, r){ const a = tmin(r.a), b = tmin(r.b); if(a == null || b == null) return false; return !f.ven.some(v => a >= tmin(v[0]) && b <= tmin(v[1])); }
function check(f, d){
  const E = [];
  if(!(d.que||'').trim()) E.push('Escribe qué es la actividad.');
  if((d.como||'').trim().length < 40) E.push('Describe cómo se realiza y en qué espacio (sé descriptivo).');
  if(!(d.mm||[]).length) E.push('Agrega el minuto a minuto.');
  (d.mm||[]).forEach((r, i) => { if(!r.a || !r.b || !(r.q||'').trim()) E.push('Completa el paso ' + (i+1) + ' del minuto a minuto (desde, hasta y qué pasa).'); });
  if(!(d.pe||[]).filter(x => x.p && (x.r||'').trim()).length) E.push('Agrega quién hace qué.');
  if(f.jmax && !(d.jg||[]).length) E.push('Agrega los juegos o estaciones con su responsable.');
  (d.ma||[]).forEach((m, i) => { if(!(m.i||'').trim() || qtyErr(m) || priceErr(m) || !m.s) E.push('Revisa el material ' + (i+1) + ' (nombre, cantidad, precio y dónde se consigue).'); });
  if(!(d.lluvia||'').trim()) E.push('Escribe el plan B por lluvia.');
  return E;
}
function people(f){ const s = []; f.eq.forEach(t => DATA.teams[t].miembros.forEach(p => s.push({p, t}))); return s; }

/* ---------- red ---------- */
async function apiList(){
  if(!API) return;
  try{
    const r = await fetch(API + '?action=list&t=' + Date.now());
    const j = await r.json();
    if(j && j.ok){
      (j.items || []).forEach(it => { if(!DIRTY[it.id]) STORE[it.id] = it; });
      ONLINE = true; LASTSYNC = Date.now(); persist(); pill();
      Object.keys(DIRTY).forEach(id => { if(DIRTY[id]) pushSave(id); });
    }
  }catch(e){ ONLINE = false; pill(); }
}
async function apiPost(body){
  const r = await fetch(API, {method:'POST', body: JSON.stringify(body)});
  return r.json();
}
function meta(f){ const b = BY[f.b]; return {bloque: (b.n ? 'Bloque ' + b.n + ' · ' : '') + b.title, actividad: f.tit, equipos: f.eq.map(t => 'E' + t).join(' + ')}; }
async function pushSave(id, force){
  const f = FB[id], r = STORE[id]; if(!r) return;
  if(!API){ DIRTY[id] = false; persist(); pill(); return; }
  try{
    const j = await apiPost({action:'save', id, meta: meta(f), data: r.data, editor: r.editor, costo: total(r.data), base: r.base == null ? (r.version||0) : r.base, force: !!force});
    if(j.ok){ STORE[id] = Object.assign({}, j.rec); DIRTY[id] = false; ONLINE = true; LASTSYNC = Date.now(); persist(); pill(); savedMark(id); }
    else if(j.conflict){ conflict(id, j.rec); }
    else throw new Error(j.error || 'error');
  }catch(e){ ONLINE = false; pill(); }
}
function pill(){
  const p = $('#syncPill'); if(!p) return;
  const pend = Object.values(DIRTY).filter(Boolean).length;
  if(!API) p.textContent = 'Modo prueba';
  else if(!ONLINE) p.textContent = pend ? 'Sin conexión · ' + pend + ' por subir' : 'Sin conexión';
  else p.textContent = pend ? 'Guardando…' : 'En línea ✓';
}
function deadPill(){
  const d = $('#deadPill'), ms = DEADLINE - Date.now();
  if(ms <= 0){ d.textContent = 'Plazo cerrado'; return; }
  const days = Math.floor(ms / 864e5), hrs = Math.floor(ms % 864e5 / 36e5);
  d.textContent = 'Cierra dom 15 · ' + (days ? days + 'd ' : '') + hrs + 'h';
}

  view = {p: h[0] || '', a: h[1], b: h[2]};
  const app = $('#app'); $('#stickyHost').innerHTML = ''; if(view.p !== 'ficha') CUR = null;

}

function unitsFor(t){
  const out = [];
  DATA.blocks.forEach(b => {
    DATA.fichas.filter(f => f.b === b.id && f.eq.includes(t)).forEach(f => out.push({k: f.eq.length > 1 ? 'conj' : 'prop', b, f}));
    if(b.cards && b.cards[t]) out.push(Object.assign({b}, b.cards[t]));
  });
  return out;
}
function stOf(id){
  const r = rec(id), f = FB[id];
  if(!r) return {k:'pre', n:'Precargada · sin empezar', c:'t-mute'};
  if(r.estado === 'enviada') return {k:'sent', n:'Enviada · v' + r.version, c:'t-ok'};
  if(r.estado === 'modificada') return {k:'mod', n:'Modificada después de enviar', c:'t-warn'};
  return {k:'draft', n:'En borrador', c:'t-oro'};
}

async function packCode(o){
  const txt = JSON.stringify(o);
  try{
    if(window.CompressionStream){
      const cs = new Blob([txt]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      const buf = new Uint8Array(await new Response(cs).arrayBuffer());
      let s = ''; buf.forEach(b => s += String.fromCharCode(b));
      return 'R2Z.' + btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
  }catch(e){}
  return 'R2.' + btoa(unescape(encodeURIComponent(txt))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpackCode(c){
  c = c.trim(); const z = c.startsWith('R2Z.'); const b64 = c.replace(/^R2Z?\./,'').replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  if(z){ const u = Uint8Array.from(bin, ch => ch.charCodeAt(0)); const ds = new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(ds).text()); }
  return JSON.parse(decodeURIComponent(escape(bin)));
}

    const k = (m.s || '—') + '|' + (m.i||'').trim().toLowerCase() + '|' + (m.t||'').trim().toLowerCase();
    const g = G[k] = G[k] || {s: m.s || '—', i: m.i, t: m.t, c: 0, tot: 0, u: new Set(), from: new Set(), re: false};
    g.c += Number(m.c) || 0; g.tot += lineTot(m); g.u.add(Number(m.u) || 0); g.from.add((BY[f.b].n ? 'B' + BY[f.b].n : 'AP') + ' ' + f.tit); g.re = g.re || m.re;
  }); });
  return Object.values(G).sort((a, b) => (a.s > b.s ? 1 : a.s < b.s ? -1 : (a.i||'').localeCompare(b.i||'')));
}
function comprasV(){
  const rows = comprasRows(); const by = {}; rows.forEach(r => (by[r.s] = by[r.s] || []).push(r));
  const grand = rows.filter(r => r.s === 'Quibdó' || r.s === 'Bogotá').reduce((a, r) => a + r.tot, 0);
  return '<div class="card"><h3>Lista de compras consolidada</h3><p class="hint">Solo fichas guardadas o enviadas. Agrupa materiales con el mismo nombre y tipo.</p><div class="alert info">Total por comprar (Quibdó + Bogotá): ' + money(grand) + '</div><div class="btnrow"><button class="btn alt" data-act="csv">Descargar CSV</button></div></div>' +
    Object.keys(by).map(s => '<div class="card"><h3>' + esc(s) + '</h3><div class="scroll"><table class="tbl"><tr><th>Material</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Total</th><th>Dónde se usa</th></tr>' +
      by[s].map(r => '<tr><td><b>' + esc(r.i) + '</b>' + (r.t ? '<br><span class="muted">' + esc(r.t) + '</span>' : '') + (r.re ? '<br><span class="tag t-ok">Reutilizable</span>' : '') + '</td><td class="r">' + r.c + '</td><td class="r">' + [...r.u].map(money).join(' / ') + '</td><td class="r">' + money(r.tot) + '</td><td class="small">' + esc([...r.from].join(' · ')) + '</td></tr>').join('') + '</table></div></div>').join('');
}
function csv(){
  const rows = comprasRows(); const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const out = [['Origen','Material','Tipo','Cantidad','Precios unitarios','Total','Reutilizable','Dónde se usa'].map(q).join(',')].concat(rows.map(r => [r.s, r.i, r.t, r.c, [...r.u].join(' / '), r.tot, r.re ? 'Sí' : 'No', [...r.from].join(' · ')].map(q).join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + out.join('\n')], {type:'text/csv'})); a.download = 'compras-mision-choco-r2.csv'; a.click();
}
async function importar(){
  const t = ($('#imp').value || ''), cs = t.match(/R2Z?\.[A-Za-z0-9_\-]+/g) || [];
  if(!cs.length){ toast('No encontré códigos R2 en el texto.'); return; }
  let n = 0;
  for(const c of cs){ try{ const o = await unpackCode(c); if(!FB[o.id]) continue; const cur = STORE[o.id];
      if(cur && (cur.version||0) > o.v) continue;
      STORE[o.id] = {id: o.id, data: o.d, version: o.v, estado: 'enviada', editor: o.e, actualizado: o.ts}; n++;
      if(API) apiPost({action:'send', id: o.id, meta: meta(FB[o.id]), data: o.d, editor: o.e, costo: total(o.d), force: true}).catch(() => {});
    }catch(e){} }
  persist(); toast(n + ' propuesta(s) traídas.'); go('#/coord/mapa');
}

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-go],[data-team],[data-me],[data-add],[data-del],[data-act],[data-close]'); if(!el) return;
  if(el.dataset.close && !el.dataset.me){ closeSheets(); return; }
  if(el.dataset.go){ go(el.dataset.go); return; }
  if(el.dataset.team){ const t = +el.dataset.team; if(!ME || ME.team !== t){ ME = {team: t, name: ''}; lsSet('r2_me', ME); } go('#/equipo/' + t + '/mie'); return; }
  if(el.dataset.me){ ME = {team: +el.dataset.t, name: el.dataset.me}; lsSet('r2_me', ME); if(el.dataset.close) closeSheets(); else route(); toast('Hola, ' + ME.name.split(' ')[0]); return; }
  if(el.dataset.add && CUR){ const f = FB[CUR.id]; if(!needMe(f)) return; const L = el.dataset.add; CUR.d[L] = CUR.d[L] || [];
    if(L === 'jg' && CUR.d.jg.length >= f.jmax){ toast('Máximo ' + f.jmax + '.'); return; }
    CUR.d[L].push(L === 'mm' ? {a:'',b:'',q:'',p:''} : L === 'pe' ? {p:'',r:''} : L === 'jg' ? {n:'',d:'',p:''} : {i:'',t:'',c:1,u:'',s:'',re:false});
    renderLists(); touch(); return; }
  if(el.dataset.del && CUR){ CUR.d[el.dataset.del].splice(+el.dataset.i, 1); renderLists(); touch(); return; }
  const a = el.dataset.act;
  if(a === 'send') sendF();
  if(a === 'sendOk') sendOk();
  if(a === 'copy'){ const t = $('#codeTxt'); t.select(); try{ await navigator.clipboard.writeText(t.value); }catch(_){ document.execCommand('copy'); } toast('Mensaje copiado'); }
  if(a === 'takeSrv'){ const id = el.dataset.id; STORE[id] = window.__srv; DIRTY[id] = false; persist(); closeSheets(); route(); toast('Se cargó la última versión.'); }
  if(a === 'keepMine'){ const id = el.dataset.id; closeSheets(); pushSave(id, true); toast('Guardando tu versión…'); }
  if(a === 'pin'){ if($('#pin').value.trim() === ADMIN_PIN){ ADMIN = true; lsSet('r2_admin', true); route(); } else toast('PIN incorrecto'); }
  if(a === 'refresh'){ await apiList(); route(); toast(API ? 'Actualizado' : 'Modo prueba: sin conexión a la hoja'); }
  if(a === 'csv') csv();
  if(a === 'imp') importar();
});
document.addEventListener('input', e => {
  if(!CUR) return; const el = e.target, f = FB[CUR.id];
  if((el.dataset.k || el.dataset.l) && !(ME && ME.name) && !document.querySelector('.sheet')) needMe(f);
  if(el.dataset.k){ CUR.d[el.dataset.k] = el.value; touch(); return; }
  if(el.dataset.l){ const L = el.dataset.l, i = +el.dataset.i, k = el.dataset.f; let v = el.value;
    if(L === 'ma' && (k === 'c' || k === 'u')) v = v === '' ? '' : Number(v);
    if(L === 'ma' && k === 're') v = v === '1';
    CUR.d[L][i][k] = v; touch();
    if(L === 'ma') budgetBox();
  }
});
document.addEventListener('change', e => { const el = e.target; if(CUR && el.dataset.l && (el.dataset.l === 'mm' || el.dataset.f === 's' || el.dataset.f === 'p')) { const y = window.scrollY; renderLists(); window.scrollTo(0, y); } });
setInterval(async () => { if(API && !Object.values(DIRTY).some(Boolean) && document.visibilityState === 'visible'){ const before = CUR ? JSON.stringify(rec(CUR.id)) : ''; await apiList(); if(CUR && JSON.stringify(rec(CUR.id)) !== before && !document.activeElement.matches('input,textarea,select')){ const y = window.scrollY; route(); window.scrollTo(0, y); toast('Se cargaron cambios de otra persona.'); } } }, 30000);
setInterval(deadPill, 60000);
deadPill(); pill(); route(); apiList().then(() => { if(view.p !== 'ficha') route(); });
</script>
